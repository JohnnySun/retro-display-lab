# RetroArch target contract for the DMG-01 physical temporal preset.
# Apply as a core/content override, not as a global frontend replacement.

video_driver = "vulkan"
video_shader_subframes = "1"
video_scale_integer = "true"
video_vsync = "true"
video_adaptive_vsync = "false"
video_variable_refresh = "false"
rewind_enable = "false"
run_ahead_enabled = "false"
fastforward_ratio = "1.000000"

# Gambatte must also load gambatte_mix_frames = "disabled" from its core
# options. The project validator and WS7 target receipt gate that separately.
