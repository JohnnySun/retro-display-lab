# RetroArch target contract for the CGB-001 stateful reference preset.
# Apply as an isolated test config or content override, never as a global replacement.
video_driver = "vulkan"
video_shader_subframes = "1"
video_scale_integer = "true"
video_scale_integer_overscale = "false"
video_aspect_ratio_auto = "true"
video_smooth = "false"
rewind_enable = "false"
run_ahead_enabled = "false"
fastforward_ratio = "1.000000"
