name: Validate shaders

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  model-checks:
    name: Model checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          # The RetroArch pack is pinned to a release tag and is deliberately
          # re-derived from that tag during --check.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
